<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Controle de Demandas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow-x: hidden; }
    .app-layout { display: flex !important; min-height: 100vh; gap: 0 !important; margin: 0 !important; padding: 0 !important; overflow-x: hidden; }
    .main-content { flex: 1; min-width: 0; overflow-x: hidden; }
    @media (min-width: 769px) {
      .sidebar { display: flex; flex-direction: column; flex-shrink: 0; min-height: 100vh; height: 100vh; position: sticky; top: 0; }
      .main-content { overflow-y: auto; }
    }
  </style>
</head>
<body>
  <div class="app-layout" id="appLayout">
    <main class="main-content">
      <div class="page-content">

        <!-- Alerta de lembretes do dia -->
        <div id="reminderAlert" style="display:none"></div>

        <!-- KPIs -->
        <div class="kpi-grid" id="kpiGrid" style="grid-template-columns: repeat(7, 1fr);">
          <div class="kpi-card"><div class="kpi-icon primary"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg></div><div class="kpi-value" id="kpiTotalDemandas">—</div><div class="kpi-label">Total de demandas</div></div>
          <div class="kpi-card"><div class="kpi-icon warning"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div><div class="kpi-value" id="kpiDemPendentes">—</div><div class="kpi-label">Demandas pendentes</div></div>
          <div class="kpi-card"><div class="kpi-icon success"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg></div><div class="kpi-value" id="kpiDemConcluidas">—</div><div class="kpi-label">Demandas concluídas</div></div>
          <div class="kpi-card"><div class="kpi-icon info"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg></div><div class="kpi-value" id="kpiSolAbertas">—</div><div class="kpi-label">Solicitações abertas</div></div>
          <div class="kpi-card"><div class="kpi-icon success"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg></div><div class="kpi-value" id="kpiSolConcluidas">—</div><div class="kpi-label">Solicitações concluídas</div></div>
          <div class="kpi-card"><div class="kpi-icon warning"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg></div><div class="kpi-value" id="kpiLemProximos">—</div><div class="kpi-label">Lembretes próximos</div></div>
          <div class="kpi-card"><div class="kpi-icon danger"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div><div class="kpi-value" id="kpiLemAtrasados">—</div><div class="kpi-label">Lembretes atrasados</div></div>
        </div>

        <!-- Gráficos -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px" id="chartsGrid">
          <div class="card">
            <div class="card-header">
              <span class="card-title">Demandas por status</span>
            </div>
            <div class="chart-container">
              <canvas id="chartDemandas"></canvas>
            </div>
          </div>
          <div class="card">
            <div class="card-header">
              <span class="card-title">Demandas por prioridade</span>
            </div>
            <div class="chart-container">
              <canvas id="chartPrioridade"></canvas>
            </div>
          </div>
        </div>

        <!-- Tabelas recentes -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px" id="tablesGrid">
          <div class="card">
            <div class="card-header">
              <span class="card-title">Demandas recentes</span>
              <a href="demandas.html" class="btn btn-ghost btn-sm">Ver todas</a>
            </div>
            <div id="recentDemandas"><div class="loading-state"><span class="spinner spinner-dark"></span> Carregando...</div></div>
          </div>
          <div class="card">
            <div class="card-header">
              <span class="card-title">Lembretes próximos</span>
              <a href="lembretes.html" class="btn btn-ghost btn-sm">Ver todos</a>
            </div>
            <div id="recentLembretes"><div class="loading-state"><span class="spinner spinner-dark"></span> Carregando...</div></div>
          </div>
        </div>

      </div>
    </main>
  </div>


  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script>renderLayout('dashboard');</script>
  <script src="../js/dashboard.js"></script>
</body>
</html>
