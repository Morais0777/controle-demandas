<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lembretes — Controle de Demandas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow-x: hidden; }
    .app-layout { display: flex !important; min-height: 100vh; gap: 0 !important; margin: 0 !important; padding: 0 !important; overflow-x: hidden; }
    .main-content { flex: 1; min-width: 0; overflow-x: hidden; }
    @media (min-width: 769px) {
      .sidebar { display: flex; flex-direction: column; flex-shrink: 0; min-height: 100vh; height: 100vh; position: sticky; top: 0; }
      .main-content { overflow-y: auto; }
    }
  </style>
</head>
<body>
  <div class="app-layout" id="appLayout">
    <main class="main-content">
      <div class="page-content">

        <div class="page-header">
          <div class="page-header-left">
            <h1 class="page-title">Lembretes</h1>
            <p class="page-subtitle">Gerencie seus lembretes e compromissos</p>
          </div>
          <button class="btn btn-primary" id="btnNovoLembrete">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Novo lembrete
          </button>
        </div>

        <!-- Alertas do dia -->
        <div id="lemAlertaHoje" style="display:none"></div>
        <div id="lemAlertaAtrasados" style="display:none"></div>

        <!-- Cards de contagem rápida -->
        <div class="kpi-grid" style="margin-bottom:20px" id="lemKpis">
          <div class="kpi-card">
            <div class="kpi-icon warning"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
            <div class="kpi-value" id="kLemHoje">—</div>
            <div class="kpi-label">Hoje</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-icon info"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
            <div class="kpi-value" id="kLemProximos">—</div>
            <div class="kpi-label">Próximos 7 dias</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-icon danger"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div>
            <div class="kpi-value" id="kLemAtrasados">—</div>
            <div class="kpi-label">Atrasados</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-icon success"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg></div>
            <div class="kpi-value" id="kLemConcluidos">—</div>
            <div class="kpi-label">Concluídos</div>
          </div>
        </div>

        <!-- Filtros -->
        <div class="filters-bar">
          <div class="search-input-wrap">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" class="search-input" id="searchLem" placeholder="Pesquisar por título...">
          </div>
          <select class="filter-select" id="filterLemStatus">
            <option value="">Todos os status</option>
            <option value="pendente">Pendente</option>
            <option value="concluido">Concluído</option>
            <option value="cancelado">Cancelado</option>
          </select>
          <select class="filter-select" id="filterLemPrioridade">
            <option value="">Todas as prioridades</option>
            <option value="baixa">Baixa</option>
            <option value="media">Média</option>
            <option value="alta">Alta</option>
            <option value="urgente">Urgente</option>
          </select>
          <select class="filter-select" id="filterLemPeriodo">
            <option value="">Todos os períodos</option>
            <option value="hoje">Hoje</option>
            <option value="semana">Esta semana</option>
            <option value="atrasados">Atrasados</option>
          </select>
          <button class="btn btn-secondary btn-sm" id="btnLimparLemFiltros">Limpar</button>
        </div>

        <!-- Tabela -->
        <div class="table-wrap">
          <table class="table-responsive" id="tableLembretes">
            <thead>
              <tr>
                <th>Título</th>
                <th>Data</th>
                <th class="hide-mobile">Horário</th>
                <th>Prioridade</th>
                <th>Status</th>
                <th class="hide-mobile">Situação</th>
                <th style="width:120px">Ações</th>
              </tr>
            </thead>
            <tbody id="tbodyLembretes">
              <tr><td colspan="7"><div class="loading-state"><span class="spinner spinner-dark"></span> Carregando...</div></td></tr>
            </tbody>
          </table>
        </div>

      </div>
    </main>
  </div>

  <!-- Modal Criar/Editar -->
  <div class="modal-overlay" id="modalLem">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="modalLemTitle">Novo lembrete</h3>
        <button class="modal-close" id="btnCloseModalLem">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <form class="form-grid" id="formLem" novalidate>
          <input type="hidden" id="lemId">
          <div class="form-group full-width">
            <label for="lemTitulo">Título *</label>
            <input type="text" id="lemTitulo" class="form-control" placeholder="Ex: Reunião com equipe" required>
          </div>
          <div class="form-group full-width">
            <label for="lemDescricao">Descrição</label>
            <textarea id="lemDescricao" class="form-control" placeholder="Detalhes do lembrete..."></textarea>
          </div>
          <div class="form-group">
            <label for="lemData">Data *</label>
            <input type="date" id="lemData" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="lemHorario">Horário</label>
            <input type="time" id="lemHorario" class="form-control">
          </div>
          <div class="form-group">
            <label for="lemPrioridade">Prioridade *</label>
            <select id="lemPrioridade" class="form-control" required>
              <option value="">Selecione...</option>
              <option value="baixa">Baixa</option>
              <option value="media">Média</option>
              <option value="alta">Alta</option>
              <option value="urgente">Urgente</option>
            </select>
          </div>
          <div class="form-group">
            <label for="lemStatus">Status</label>
            <select id="lemStatus" class="form-control">
              <option value="pendente">Pendente</option>
              <option value="concluido">Concluído</option>
              <option value="cancelado">Cancelado</option>
            </select>
          </div>
          <div class="form-group full-width">
            <label for="lemObservacoes">Observações</label>
            <textarea id="lemObservacoes" class="form-control" placeholder="Observações adicionais..."></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="btnCancelLem">Cancelar</button>
        <button class="btn btn-primary" id="btnSaveLem">Salvar lembrete</button>
      </div>
    </div>
  </div>

  <!-- Modal Detalhes -->
  <div class="modal-overlay" id="modalLemDetalhe">
    <div class="modal modal-lg">
      <div class="modal-header">
        <h3 class="modal-title">Detalhes do lembrete</h3>
        <button class="modal-close" id="btnCloseLemDetalhe">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body" id="lemDetalheContent"></div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="btnCloseLemDetalheFooter">Fechar</button>
        <button class="btn btn-primary" id="btnEditarLemDetalhe">Editar</button>
      </div>
    </div>
  </div>


  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/app.js"></script>
  <script>renderLayout('lembretes');</script>
  <script src="../js/lembretes.js"></script>
</body>
</html>
