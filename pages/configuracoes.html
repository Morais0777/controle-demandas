<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configurações — Controle de Demandas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/home.css">
  <style>
    /* ── Configurações: página ── */
    .config-page {
      padding: 32px 32px 48px;
      max-width: 660px;
    }

    /* Título simples no topo */
    .config-page-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-primary);
      margin: 0 0 4px;
    }
    .config-page-sub {
      font-size: 0.875rem;
      color: var(--text-secondary);
      margin: 0 0 32px;
    }

    /* Cards de seção */
    .cfg-card {
      background: var(--surface, #fff);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    /* Cabeçalho do card */
    .cfg-card-head {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 20px 24px 0;
    }
    .cfg-card-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--primary-light, rgba(99,102,241,0.1));
      color: var(--primary, #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .cfg-card-head-text h3 {
      font-size: 0.9375rem;
      font-weight: 600;
      color: var(--text-primary);
      margin: 0 0 2px;
    }
    .cfg-card-head-text p {
      font-size: 0.8125rem;
      color: var(--text-secondary);
      margin: 0;
    }

    /* Divisor interno */
    .cfg-divider {
      height: 1px;
      background: var(--border);
      margin: 20px 24px 0;
    }

    /* Corpo do card */
    .cfg-card-body {
      padding: 20px 24px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Preview do usuário */
    .cfg-user-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg-subtle, rgba(99,102,241,0.04));
    }
    .cfg-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--primary, #6366f1);
      color: #fff;
      font-size: 0.9375rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      letter-spacing: -0.5px;
    }
    .cfg-user-info { min-width: 0; }
    .cfg-user-name {
      font-size: 0.9375rem;
      font-weight: 600;
      color: var(--text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .cfg-user-email {
      font-size: 0.8125rem;
      color: var(--text-secondary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-top: 1px;
    }

    /* Campo de formulário */
    .cfg-field { display: flex; flex-direction: column; gap: 6px; }
    .cfg-field label {
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text-primary);
    }
    .cfg-field .form-control { width: 100%; box-sizing: border-box; }
    .cfg-field-hint {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin: 0;
    }

    /* Linha de ação */
    .cfg-action-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .cfg-status {
      font-size: 0.8125rem;
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .cfg-status.visible { opacity: 1; }
    .cfg-status.success { color: var(--success, #22c55e); }
    .cfg-status.error   { color: var(--danger,  #ef4444); }

    /* Seletor de tema — cards grandes */
    .cfg-theme-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .cfg-theme-opt { position: relative; }
    .cfg-theme-opt input[type="radio"] {
      position: absolute; opacity: 0; width: 0; height: 0;
    }
    .cfg-theme-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 14px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s;
      background: var(--surface, #fff);
    }
    .cfg-theme-opt input:checked + .cfg-theme-card {
      border-color: var(--primary, #6366f1);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
    }

    /* Miniatura do tema */
    .cfg-theme-thumb {
      width: 100%;
      height: 56px;
      border-radius: 7px;
      overflow: hidden;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }
    .cfg-theme-thumb-bar { height: 14px; background: var(--primary, #6366f1); }
    .cfg-theme-thumb-body {
      flex: 1;
      display: grid;
      grid-template-columns: 60px 1fr;
    }
    .cfg-theme-thumb-sidebar { border-right: 1px solid; }
    .cfg-theme-thumb-content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      padding: 6px 8px;
    }
    .cfg-theme-thumb-line {
      border-radius: 3px;
      height: 5px;
    }

    /* Cores por tema */
    .thumb-light .cfg-theme-thumb-body { background: #f8f9fa; }
    .thumb-light .cfg-theme-thumb-sidebar { background: #eef0f4; border-color: #e2e5ea; }
    .thumb-light .cfg-theme-thumb-line { background: #d1d5db; }
    .thumb-dark  .cfg-theme-thumb-body { background: #1a1b2e; }
    .thumb-dark  .cfg-theme-thumb-sidebar { background: #141526; border-color: #2a2b40; }
    .thumb-dark  .cfg-theme-thumb-line { background: #374151; }

    /* Rodapé do card de tema */
    .cfg-theme-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .cfg-theme-label {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-primary);
    }
    .cfg-theme-radio {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .cfg-theme-opt input:checked + .cfg-theme-card .cfg-theme-radio {
      background: var(--primary, #6366f1);
      border-color: var(--primary, #6366f1);
    }
    .cfg-theme-opt input:checked + .cfg-theme-card .cfg-theme-radio::after {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fff;
      display: block;
    }

    /* Responsivo */
    @media (max-width: 600px) {
      .config-page { padding: 20px 16px 40px; }
      .cfg-card-head, .cfg-card-body { padding-left: 16px; padding-right: 16px; }
      .cfg-divider { margin-left: 16px; margin-right: 16px; }
      .cfg-theme-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app-layout" id="appLayout">
    <!-- Sidebar injetada pelo renderLayout() -->
    <div class="main-content">
      <!-- Topbar -->
      <header class="topbar">
        <button class="btn-icon topbar-menu-btn" onclick="toggleMobileMenu()" aria-label="Menu">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <h1 class="topbar-title" id="topbarTitle">Configurações</h1>
        <div class="topbar-actions">
          <button class="btn-icon" onclick="toggleTheme()" title="Alternar tema" id="btnThemeToggle">
            <svg id="iconTheme" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- Conteúdo principal -->
      <main class="page-content config-page">

        <h2 class="config-page-title">Configurações</h2>
        <p class="config-page-sub">Personalize sua conta e a aparência do sistema.</p>

        <!-- ── Card: Perfil ──────────────────────────────── -->
        <div class="cfg-card">
          <div class="cfg-card-head">
            <div class="cfg-card-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </div>
            <div class="cfg-card-head-text">
              <h3>Perfil</h3>
              <p>Altere como seu nome é exibido no sistema.</p>
            </div>
          </div>
          <div class="cfg-divider"></div>
          <div class="cfg-card-body">
            <!-- Preview do usuário -->
            <div class="cfg-user-row">
              <div class="cfg-avatar" id="avatarPreview">?</div>
              <div class="cfg-user-info">
                <div class="cfg-user-name" id="previewName">Carregando…</div>
                <div class="cfg-user-email" id="previewEmail">—</div>
              </div>
            </div>
            <!-- Campo -->
            <div class="cfg-field">
              <label for="inputNome">Nome de usuário</label>
              <input type="text" id="inputNome" class="form-control"
                placeholder="Ex: Maycon Morais" maxlength="60" autocomplete="name">
              <p class="cfg-field-hint">Exibido na sidebar e nas iniciais do avatar.</p>
            </div>
            <!-- Ação -->
            <div class="cfg-action-row">
              <button class="btn btn-primary" id="btnSalvarPerfil" onclick="salvarPerfil()">
                Salvar alterações
              </button>
              <span class="cfg-status" id="statusPerfil"></span>
            </div>
          </div>
        </div>

        <!-- ── Card: Aparência ───────────────────────────── -->
        <div class="cfg-card">
          <div class="cfg-card-head">
            <div class="cfg-card-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            </div>
            <div class="cfg-card-head-text">
              <h3>Aparência</h3>
              <p>Escolha o tema visual. A preferência é salva automaticamente.</p>
            </div>
          </div>
          <div class="cfg-divider"></div>
          <div class="cfg-card-body">
            <div class="cfg-theme-grid">

              <!-- Tema Claro -->
              <label class="cfg-theme-opt">
                <input type="radio" name="tema" value="light" id="temaLight" onchange="aplicarTemaSelecionado('light')">
                <div class="cfg-theme-card">
                  <div class="cfg-theme-thumb thumb-light">
                    <div class="cfg-theme-thumb-bar"></div>
                    <div class="cfg-theme-thumb-body">
                      <div class="cfg-theme-thumb-sidebar"></div>
                      <div class="cfg-theme-thumb-content">
                        <div class="cfg-theme-thumb-line" style="width:70%"></div>
                        <div class="cfg-theme-thumb-line" style="width:50%"></div>
                        <div class="cfg-theme-thumb-line" style="width:60%"></div>
                      </div>
                    </div>
                  </div>
                  <div class="cfg-theme-footer">
                    <span class="cfg-theme-label">☀️ Claro</span>
                    <span class="cfg-theme-radio"></span>
                  </div>
                </div>
              </label>

              <!-- Tema Escuro -->
              <label class="cfg-theme-opt">
                <input type="radio" name="tema" value="dark" id="temaDark" onchange="aplicarTemaSelecionado('dark')">
                <div class="cfg-theme-card">
                  <div class="cfg-theme-thumb thumb-dark">
                    <div class="cfg-theme-thumb-bar"></div>
                    <div class="cfg-theme-thumb-body">
                      <div class="cfg-theme-thumb-sidebar"></div>
                      <div class="cfg-theme-thumb-content">
                        <div class="cfg-theme-thumb-line" style="width:70%"></div>
                        <div class="cfg-theme-thumb-line" style="width:50%"></div>
                        <div class="cfg-theme-thumb-line" style="width:60%"></div>
                      </div>
                    </div>
                  </div>
                  <div class="cfg-theme-footer">
                    <span class="cfg-theme-label">🌙 Escuro</span>
                    <span class="cfg-theme-radio"></span>
                  </div>
                </div>
              </label>

            </div>
            <span class="cfg-status" id="statusTema"></span>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/configuracoes.js"></script>
</body>
</html>
