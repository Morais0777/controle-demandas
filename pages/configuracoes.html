<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configurações — Controle de Demandas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/home.css">
  <style>
    /* ── Configurações: layout geral ── */
    .config-page {
      padding: 32px 28px;
      max-width: 720px;
    }

    /* Cabeçalho da página */
    .config-page-header {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 36px;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--border);
    }
    .config-page-header-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: var(--primary-light, rgba(99,102,241,0.1));
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      flex-shrink: 0;
    }
    .config-page-title {
      font-size: 1.375rem;
      font-weight: 700;
      color: var(--text-primary);
      margin: 0 0 4px;
      line-height: 1.2;
    }
    .config-page-sub {
      font-size: 0.875rem;
      color: var(--text-secondary);
      margin: 0;
    }

    /* Seções com label lateral */
    .config-section {
      display: grid;
      grid-template-columns: 200px 1fr;
      gap: 32px;
      padding: 28px 0;
      border-bottom: 1px solid var(--border);
    }
    .config-section:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }
    .config-section-label {
      padding-top: 2px;
    }
    .config-section-label h3 {
      font-size: 0.9375rem;
      font-weight: 600;
      color: var(--text-primary);
      margin: 0 0 4px;
    }
    .config-section-label p {
      font-size: 0.8125rem;
      color: var(--text-secondary);
      margin: 0;
      line-height: 1.5;
    }
    .config-section-body {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Preview do usuário */
    .user-preview {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      background: var(--bg, rgba(0,0,0,0.03));
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .user-preview-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--primary, #6366f1);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      font-weight: 700;
      flex-shrink: 0;
      letter-spacing: -0.5px;
      transition: background 0.2s;
    }
    .user-preview-info {
      min-width: 0;
    }
    .user-preview-name {
      font-size: 0.9375rem;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .user-preview-email {
      font-size: 0.8125rem;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }

    /* Campos de formulário */
    .config-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .config-field label {
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text-primary);
    }
    .config-field .form-control {
      width: 100%;
      box-sizing: border-box;
    }
    .config-field .field-hint {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin: 0;
    }

    /* Rodapé da ação */
    .config-action-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-top: 4px;
    }
    .config-status-msg {
      font-size: 0.8125rem;
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .config-status-msg.visible { opacity: 1; }
    .config-status-msg.success { color: var(--success, #22c55e); }
    .config-status-msg.error   { color: var(--danger,  #ef4444); }

    /* Seletor de tema */
    .theme-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .theme-option {
      position: relative;
      cursor: pointer;
    }
    .theme-option input[type="radio"] {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }
    .theme-option-label {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: var(--bg, rgba(0,0,0,0.02));
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .theme-option input[type="radio"]:checked + .theme-option-label {
      border-color: var(--primary, #6366f1);
      background: var(--primary-light, rgba(99,102,241,0.07));
    }
    .theme-preview {
      width: 36px;
      height: 26px;
      border-radius: 5px;
      border: 1px solid var(--border);
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
    }
    .theme-preview-bar {
      height: 8px;
      background: var(--primary, #6366f1);
    }
    .theme-preview-body {
      flex: 1;
      display: flex;
      gap: 3px;
      padding: 3px 4px;
    }
    .theme-preview-line {
      border-radius: 2px;
      height: 100%;
    }
    .theme-light .theme-preview-body { background: #f5f5f5; }
    .theme-light .theme-preview-line { background: #d1d5db; }
    .theme-dark  .theme-preview-body { background: #1e1e2e; }
    .theme-dark  .theme-preview-line { background: #374151; }
    .theme-option-text {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-primary);
      flex: 1;
    }
    .theme-option-check {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .theme-option input[type="radio"]:checked + .theme-option-label .theme-option-check {
      background: var(--primary, #6366f1);
      border-color: var(--primary, #6366f1);
    }
    .theme-option input[type="radio"]:checked + .theme-option-label .theme-option-check::after {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fff;
      display: block;
    }

    /* Responsivo */
    @media (max-width: 640px) {
      .config-page { padding: 20px 16px; }
      .config-section { grid-template-columns: 1fr; gap: 16px; }
      .theme-grid { grid-template-columns: 1fr; }
      .config-page-header { flex-direction: column; gap: 12px; }
    }
  </style>
</head>
<body>
  <div class="app-layout" id="appLayout">
    <!-- Sidebar injetada pelo renderLayout() -->
    <div class="main-content">
      <!-- Topbar -->
      <header class="topbar">
        <button class="btn-icon topbar-menu-btn" onclick="toggleMobileMenu()" aria-label="Menu">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <h1 class="topbar-title" id="topbarTitle">Configurações</h1>
        <div class="topbar-actions">
          <button class="btn-icon" onclick="toggleTheme()" title="Alternar tema" id="btnThemeToggle">
            <svg id="iconTheme" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- Conteúdo principal -->
      <main class="page-content config-page">

        <!-- Cabeçalho da página -->
        <div class="config-page-header">
          <div class="config-page-header-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
          </div>
          <div>
            <h2 class="config-page-title">Configurações</h2>
            <p class="config-page-sub">Personalize sua conta e a aparência do sistema.</p>
          </div>
        </div>

        <!-- ── Seção: Perfil ─────────────────────────────── -->
        <div class="config-section">
          <div class="config-section-label">
            <h3>Perfil</h3>
            <p>Seu nome é exibido na sidebar e no avatar do sistema.</p>
          </div>
          <div class="config-section-body">
            <!-- Preview -->
            <div class="user-preview">
              <div class="user-preview-avatar" id="avatarPreview">?</div>
              <div class="user-preview-info">
                <div class="user-preview-name" id="previewName">Carregando…</div>
                <div class="user-preview-email" id="previewEmail">—</div>
              </div>
            </div>
            <!-- Campo nome -->
            <div class="config-field">
              <label for="inputNome">Nome de usuário</label>
              <input
                type="text"
                id="inputNome"
                class="form-control"
                placeholder="Ex: Maycon Morais"
                maxlength="60"
                autocomplete="name"
              >
              <p class="field-hint">Aparece na sidebar e nas iniciais do avatar.</p>
            </div>
            <!-- Ação -->
            <div class="config-action-row">
              <button class="btn btn-primary" id="btnSalvarPerfil" onclick="salvarPerfil()">
                Salvar alterações
              </button>
              <span class="config-status-msg" id="statusPerfil"></span>
            </div>
          </div>
        </div>

        <!-- ── Seção: Aparência ──────────────────────────── -->
        <div class="config-section">
          <div class="config-section-label">
            <h3>Aparência</h3>
            <p>Escolha o tema visual do sistema. A preferência é salva automaticamente.</p>
          </div>
          <div class="config-section-body">
            <div class="theme-grid">
              <!-- Tema Claro -->
              <label class="theme-option">
                <input type="radio" name="tema" value="light" id="temaLight" onchange="aplicarTemaSelecionado('light')">
                <span class="theme-option-label">
                  <span class="theme-preview theme-light">
                    <span class="theme-preview-bar"></span>
                    <span class="theme-preview-body">
                      <span class="theme-preview-line" style="flex:2"></span>
                      <span class="theme-preview-line" style="flex:1"></span>
                    </span>
                  </span>
                  <span class="theme-option-text">Claro</span>
                  <span class="theme-option-check"></span>
                </span>
              </label>
              <!-- Tema Escuro -->
              <label class="theme-option">
                <input type="radio" name="tema" value="dark" id="temaDark" onchange="aplicarTemaSelecionado('dark')">
                <span class="theme-option-label">
                  <span class="theme-preview theme-dark">
                    <span class="theme-preview-bar"></span>
                    <span class="theme-preview-body">
                      <span class="theme-preview-line" style="flex:2"></span>
                      <span class="theme-preview-line" style="flex:1"></span>
                    </span>
                  </span>
                  <span class="theme-option-text">Escuro</span>
                  <span class="theme-option-check"></span>
                </span>
              </label>
            </div>
            <span class="config-status-msg" id="statusTema" style="opacity:0"></span>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/configuracoes.js"></script>
</body>
</html>
