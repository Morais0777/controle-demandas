<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configurações — Controle de Demandas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/home.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    /* ══════════════════════════════════════════════════════════════
       CONFIGURAÇÕES — estilos locais (escopo: apenas esta página)

       PROBLEMA CORRIGIDO:
       Os cards usavam background: var(--surface, #fff) e
       background: var(--bg-subtle, rgba(...)), onde --surface e
       --border provavelmente não estavam definidos para o tema
       escuro em variables.css, fazendo os cards ficarem brancos.

       SOLUÇÃO:
       Criamos variáveis locais com prefixo --cfg- que são
       explicitamente definidas para [data-theme="light"] e
       [data-theme="dark"]. Essas variáveis são isoladas desta
       página e não afetam outras páginas do sistema.
       ══════════════════════════════════════════════════════════════ */

    /* ── Tokens locais — TEMA CLARO ─────────────────────────────── */
    :root,
    [data-theme="light"] {
      --cfg-card-bg:      #ffffff;
      --cfg-subtle-bg:    #f5f6fa;
      --cfg-border:       rgba(0, 0, 0, 0.08);
      --cfg-border-solid: #e4e6ed;
      --cfg-icon-bg:      rgba(99, 102, 241, 0.08);
      --cfg-shadow-sm:    0 1px 3px rgba(0, 0, 0, 0.06),
                          0 1px 2px rgba(0, 0, 0, 0.04);
    }

    /* ── Tokens locais — TEMA ESCURO ─────────────────────────────── */
    /*
       --cfg-card-bg: cor sólida escura para os cards (sem fallback branco)
       --cfg-subtle-bg: fundo levemente diferente do card para profundidade
       --cfg-border: borda sutil em cima de fundos escuros
       --cfg-icon-bg: destaque do ícone com mais opacidade no escuro
       --cfg-shadow-sm: sombra mais intensa, necessária em fundos escuros
    */
    [data-theme="dark"] {
      --cfg-card-bg:      #1e2035;
      --cfg-subtle-bg:    rgba(255, 255, 255, 0.04);
      --cfg-border:       rgba(255, 255, 255, 0.08);
      --cfg-border-solid: rgba(255, 255, 255, 0.09);
      --cfg-icon-bg:      rgba(99, 102, 241, 0.18);
      --cfg-shadow-sm:    0 2px 8px rgba(0, 0, 0, 0.45),
                          0 4px 20px rgba(0, 0, 0, 0.25);
    }

    /* ── Layout da página ──────────────────────────────────────── */
    .config-page {
      padding: 32px 32px 56px;
      max-width: 680px;
    }

    /* ── Cabeçalho da página ───────────────────────────────────── */
    .config-page-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-primary);
      margin: 0 0 6px;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .config-page-sub {
      font-size: 0.875rem;
      color: var(--text-secondary);
      margin: 0 0 28px;
      line-height: 1.5;
    }

    /* ── Cards de seção ────────────────────────────────────────── */
    /* Usa --cfg-card-bg (sólido e correto em ambos os temas) em vez
       de var(--surface, #fff) que causava o fundo branco no escuro. */
    .cfg-card {
      background: var(--cfg-card-bg);
      border: 1px solid var(--cfg-border-solid);
      border-radius: 16px;
      margin-bottom: 20px;
      overflow: hidden;
      box-shadow: var(--cfg-shadow-sm);
      transition: box-shadow 0.2s ease;
    }

    /* ── Cabeçalho do card ─────────────────────────────────────── */
    .cfg-card-head {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 22px 24px 0;
    }

    /* Usa --cfg-icon-bg para ter opacidade correta em ambos os temas */
    .cfg-card-icon {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      background: var(--cfg-icon-bg);
      color: var(--primary, #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .cfg-card-head-text h3 {
      font-size: 0.9375rem;
      font-weight: 600;
      color: var(--text-primary);
      margin: 0 0 2px;
      letter-spacing: -0.01em;
    }

    .cfg-card-head-text p {
      font-size: 0.8125rem;
      color: var(--text-secondary);
      margin: 0;
      line-height: 1.45;
    }

    /* ── Divisor interno ───────────────────────────────────────── */
    /* Usa --cfg-border-solid para ser visível nos dois temas */
    .cfg-divider {
      height: 1px;
      background: var(--cfg-border-solid);
      margin: 20px 24px 0;
    }

    /* ── Corpo do card ─────────────────────────────────────────── */
    .cfg-card-body {
      padding: 20px 24px 26px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* ── Preview do usuário ────────────────────────────────────── */
    /* Usa --cfg-subtle-bg e --cfg-border para fundo leve sobre o card */
    .cfg-user-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border: 1px solid var(--cfg-border-solid);
      border-radius: 12px;
      background: var(--cfg-subtle-bg);
    }

    .cfg-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--primary, #6366f1);
      color: #fff;
      font-size: 0.9375rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      letter-spacing: -0.5px;
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.35);
    }

    .cfg-user-info { min-width: 0; }

    .cfg-user-name {
      font-size: 0.9375rem;
      font-weight: 600;
      color: var(--text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      letter-spacing: -0.01em;
    }

    .cfg-user-email {
      font-size: 0.8125rem;
      color: var(--text-secondary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-top: 2px;
    }

    /* ── Campo de formulário ───────────────────────────────────── */
    .cfg-field { display: flex; flex-direction: column; gap: 7px; }

    .cfg-field label {
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text-primary);
    }

    .cfg-field .form-control {
      width: 100%;
      box-sizing: border-box;
    }

    .cfg-field-hint {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin: 0;
      line-height: 1.45;
    }

    /* ── Linha de ação ─────────────────────────────────────────── */
    .cfg-action-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* ── Mensagens de status ───────────────────────────────────── */
    .cfg-status {
      font-size: 0.8125rem;
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
    }
    .cfg-status.visible { opacity: 1; }
    .cfg-status.success { color: var(--success, #22c55e); }
    .cfg-status.error   { color: var(--danger,  #ef4444); }

    /* ── Grid de seleção de tema ───────────────────────────────── */
    .cfg-theme-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .cfg-theme-opt { position: relative; }

    .cfg-theme-opt input[type="radio"] {
      position: absolute; opacity: 0; width: 0; height: 0;
    }

    /* Usa --cfg-subtle-bg em vez de var(--surface, #fff) */
    .cfg-theme-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 14px;
      border: 1.5px solid var(--cfg-border-solid);
      border-radius: 13px;
      cursor: pointer;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      background: var(--cfg-subtle-bg);
    }

    .cfg-theme-card:hover {
      border-color: rgba(99, 102, 241, 0.4);
    }

    .cfg-theme-opt input:checked + .cfg-theme-card {
      border-color: var(--primary, #6366f1);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.14);
    }

    /* ── Miniatura do tema ─────────────────────────────────────── */
    .cfg-theme-thumb {
      width: 100%;
      height: 58px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--cfg-border-solid);
      display: flex;
      flex-direction: column;
    }

    .cfg-theme-thumb-bar { height: 14px; background: var(--primary, #6366f1); }

    .cfg-theme-thumb-body {
      flex: 1;
      display: grid;
      grid-template-columns: 52px 1fr;
    }

    .cfg-theme-thumb-sidebar { border-right: 1px solid; }

    .cfg-theme-thumb-content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      padding: 6px 8px;
    }

    .cfg-theme-thumb-line { border-radius: 3px; height: 5px; }

    /* ── Cores FIXAS das miniaturas (não seguem o tema ativo) ──── */
    /* Estas são representações visuais do tema, não o tema em si.  */
    .thumb-light .cfg-theme-thumb-body    { background: #f3f4f6; }
    .thumb-light .cfg-theme-thumb-sidebar { background: #e8ebf0; border-color: #d8dce4; }
    .thumb-light .cfg-theme-thumb-line    { background: #c8cdd6; }

    .thumb-dark  .cfg-theme-thumb-body    { background: #1a1b2e; }
    .thumb-dark  .cfg-theme-thumb-sidebar { background: #12131e; border-color: #272840; }
    .thumb-dark  .cfg-theme-thumb-line    { background: #3a3d56; }

    /* ── Rodapé do card de tema ────────────────────────────────── */
    .cfg-theme-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .cfg-theme-label {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-primary);
    }

    /* ── Bolinha de rádio customizada ──────────────────────────── */
    .cfg-theme-radio {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.5px solid var(--cfg-border-solid);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease, border-color 0.15s ease;
      flex-shrink: 0;
    }

    .cfg-theme-opt input:checked + .cfg-theme-card .cfg-theme-radio {
      background: var(--primary, #6366f1);
      border-color: var(--primary, #6366f1);
    }

    .cfg-theme-opt input:checked + .cfg-theme-card .cfg-theme-radio::after {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fff;
      display: block;
    }

    /* ── Ajuste fino do input no tema escuro ───────────────────── */
    /* Aplicado apenas se os estilos globais de form-control não
       cobrirem o tema escuro. Inofensivo caso já estejam cobertos. */
    [data-theme="dark"] .cfg-field .form-control {
      background-color: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.11);
      color: var(--text-primary);
    }
    [data-theme="dark"] .cfg-field .form-control::placeholder {
      opacity: 0.45;
    }
    [data-theme="dark"] .cfg-field .form-control:focus {
      background-color: rgba(255, 255, 255, 0.08);
      border-color: var(--primary, #6366f1);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
      outline: none;
    }

    /* ── Botões de ícone no tema escuro ───────────────────────── */
    /* O btn-icon do CSS global provavelmente tem background claro.
       Este override garante transparência no tema escuro. */
    [data-theme="dark"] .btn-icon {
      background: transparent;
      border-color: transparent;
      color: var(--text-secondary, rgba(255, 255, 255, 0.65));
    }
    [data-theme="dark"] .btn-icon:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: transparent;
    }

    /* ── Responsivo ────────────────────────────────────────────── */
    @media (max-width: 768px) {
      /* No mobile a topbar já exibe o título da página — esconde o h2 estático */
      .config-page-title,
      .config-page-sub { display: none; }
    }
    @media (max-width: 600px) {
      .config-page { padding: 20px 16px 44px; }
      .cfg-card-head  { padding-left: 16px; padding-right: 16px; }
      .cfg-card-body  { padding-left: 16px; padding-right: 16px; }
      .cfg-divider    { margin-left: 16px; margin-right: 16px; }
      .cfg-theme-grid { grid-template-columns: 1fr; }
      .cfg-action-row { flex-direction: column; align-items: flex-start; }
    }

    /* ── Layout responsivo (sidebar + topbar mobile) ─────────── */
    html, body { margin: 0; padding: 0; overflow-x: hidden; }
    .app-layout { display: flex !important; min-height: 100vh; gap: 0 !important; margin: 0 !important; padding: 0 !important; overflow-x: hidden; }
    .main-content { flex: 1; min-width: 0; overflow-x: hidden; }
    @media (min-width: 769px) {
      .sidebar { display: flex; flex-direction: column; flex-shrink: 0; min-height: 100vh; height: 100vh; position: sticky; top: 0; }
      .main-content { overflow-y: auto; }
    }
  </style>
</head>
<body>
  <div class="app-layout" id="appLayout">
    <!-- Sidebar injetada pelo renderLayout() -->
    <div class="main-content">
      <!-- Conteúdo principal -->
      <main class="page-content config-page">

        <h2 class="config-page-title">Configurações</h2>
        <p class="config-page-sub">Personalize sua conta e a aparência do sistema.</p>

        <!-- ── Card: Perfil ──────────────────────────────────── -->
        <div class="cfg-card">
          <div class="cfg-card-head">
            <div class="cfg-card-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </div>
            <div class="cfg-card-head-text">
              <h3>Perfil</h3>
              <p>Altere como seu nome é exibido no sistema.</p>
            </div>
          </div>
          <div class="cfg-divider"></div>
          <div class="cfg-card-body">
            <!-- Preview do usuário -->
            <div class="cfg-user-row">
              <div class="cfg-avatar" id="avatarPreview">?</div>
              <div class="cfg-user-info">
                <div class="cfg-user-name" id="previewName">Carregando…</div>
                <div class="cfg-user-email" id="previewEmail">—</div>
              </div>
            </div>
            <!-- Campo -->
            <div class="cfg-field">
              <label for="inputNome">Nome de usuário</label>
              <input type="text" id="inputNome" class="form-control"
                placeholder="Ex: Maycon Morais" maxlength="60" autocomplete="name">
              <p class="cfg-field-hint">Exibido na sidebar e nas iniciais do avatar.</p>
            </div>
            <!-- Ação -->
            <div class="cfg-action-row">
              <button class="btn btn-primary" id="btnSalvarPerfil" onclick="salvarPerfil()">
                Salvar alterações
              </button>
              <span class="cfg-status" id="statusPerfil"></span>
            </div>
          </div>
        </div>

        <!-- ── Card: Aparência ───────────────────────────────── -->
        <div class="cfg-card">
          <div class="cfg-card-head">
            <div class="cfg-card-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            </div>
            <div class="cfg-card-head-text">
              <h3>Aparência</h3>
              <p>Escolha o tema visual. A preferência é salva automaticamente.</p>
            </div>
          </div>
          <div class="cfg-divider"></div>
          <div class="cfg-card-body">
            <div class="cfg-theme-grid">

              <!-- Tema Claro -->
              <label class="cfg-theme-opt">
                <input type="radio" name="tema" value="light" id="temaLight" onchange="aplicarTemaSelecionado('light')">
                <div class="cfg-theme-card">
                  <div class="cfg-theme-thumb thumb-light">
                    <div class="cfg-theme-thumb-bar"></div>
                    <div class="cfg-theme-thumb-body">
                      <div class="cfg-theme-thumb-sidebar"></div>
                      <div class="cfg-theme-thumb-content">
                        <div class="cfg-theme-thumb-line" style="width:70%"></div>
                        <div class="cfg-theme-thumb-line" style="width:50%"></div>
                        <div class="cfg-theme-thumb-line" style="width:60%"></div>
                      </div>
                    </div>
                  </div>
                  <div class="cfg-theme-footer">
                    <span class="cfg-theme-label">☀️ Claro</span>
                    <span class="cfg-theme-radio"></span>
                  </div>
                </div>
              </label>

              <!-- Tema Escuro -->
              <label class="cfg-theme-opt">
                <input type="radio" name="tema" value="dark" id="temaDark" onchange="aplicarTemaSelecionado('dark')">
                <div class="cfg-theme-card">
                  <div class="cfg-theme-thumb thumb-dark">
                    <div class="cfg-theme-thumb-bar"></div>
                    <div class="cfg-theme-thumb-body">
                      <div class="cfg-theme-thumb-sidebar"></div>
                      <div class="cfg-theme-thumb-content">
                        <div class="cfg-theme-thumb-line" style="width:70%"></div>
                        <div class="cfg-theme-thumb-line" style="width:50%"></div>
                        <div class="cfg-theme-thumb-line" style="width:60%"></div>
                      </div>
                    </div>
                  </div>
                  <div class="cfg-theme-footer">
                    <span class="cfg-theme-label">🌙 Escuro</span>
                    <span class="cfg-theme-radio"></span>
                  </div>
                </div>
              </label>

            </div>
            <span class="cfg-status" id="statusTema"></span>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/configuracoes.js"></script>
</body>
</html>
