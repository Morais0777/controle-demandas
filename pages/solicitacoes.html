<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solicitações — Controle de Demandas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow-x: hidden; }
    .app-layout { display: flex !important; min-height: 100vh; gap: 0 !important; margin: 0 !important; padding: 0 !important; overflow-x: hidden; }
    .main-content { flex: 1; min-width: 0; overflow-x: hidden; }
    @media (min-width: 769px) {
      .sidebar { display: flex; flex-direction: column; flex-shrink: 0; min-height: 100vh; height: 100vh; position: sticky; top: 0; }
      .main-content { overflow-y: auto; }
    }
  </style>
</head>
<body>
  <div class="app-layout" id="appLayout">
    <main class="main-content">
      <div class="page-content">

        <div class="page-header">
          <div class="page-header-left">
            <h1 class="page-title">Solicitações</h1>
            <p class="page-subtitle">Gerencie todas as solicitações recebidas</p>
          </div>
          <button class="btn btn-primary" id="btnNovaSolicitacao">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Nova solicitação
          </button>
        </div>

        <div class="filters-bar">
          <div class="search-input-wrap">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" class="search-input" id="searchSol" placeholder="Pesquisar por título, solicitante, responsável...">
          </div>
          <select class="filter-select" id="filterSolStatus">
            <option value="">Todos os status</option>
            <option value="aberta">Aberta</option>
            <option value="em_andamento">Em andamento</option>
            <option value="concluida">Concluída</option>
            <option value="cancelada">Cancelada</option>
          </select>
          <select class="filter-select" id="filterSolPrioridade">
            <option value="">Todas as prioridades</option>
            <option value="baixa">Baixa</option>
            <option value="media">Média</option>
            <option value="alta">Alta</option>
            <option value="urgente">Urgente</option>
          </select>
          <input type="date" class="filter-select" id="filterSolDataInicio" title="Data início">
          <input type="date" class="filter-select" id="filterSolDataFim" title="Data fim">
          <button class="btn btn-secondary btn-sm" id="btnLimparSolFiltros">Limpar</button>
        </div>

        <div class="table-wrap">
          <table class="table-responsive" id="tableSolicitacoes">
            <thead>
              <tr>
                <th>Título</th>
                <th class="hide-mobile">Solicitante</th>
                <th class="hide-mobile">Responsável</th>
                <th>Prioridade</th>
                <th>Status</th>
                <th class="hide-mobile">Prazo</th>
                <th style="width:100px">Ações</th>
              </tr>
            </thead>
            <tbody id="tbodySolicitacoes">
              <tr><td colspan="7"><div class="loading-state"><span class="spinner spinner-dark"></span> Carregando...</div></td></tr>
            </tbody>
          </table>
        </div>

      </div>
    </main>
  </div>

  <!-- Modal Criar/Editar -->
  <div class="modal-overlay" id="modalSol">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="modalSolTitle">Nova solicitação</h3>
        <button class="modal-close" id="btnCloseModalSol">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <form class="form-grid" id="formSol" novalidate>
          <input type="hidden" id="solId">
          <div class="form-group full-width">
            <label for="solTitulo">Título / Assunto *</label>
            <input type="text" id="solTitulo" class="form-control" placeholder="Ex: Solicitação de acesso ao sistema" required>
          </div>
          <div class="form-group full-width">
            <label for="solDescricao">Descrição</label>
            <textarea id="solDescricao" class="form-control" placeholder="Descreva a solicitação..."></textarea>
          </div>
          <div class="form-group">
            <label for="solSolicitante">Solicitante *</label>
            <input type="text" id="solSolicitante" class="form-control" placeholder="Nome de quem solicitou" required>
          </div>
          <div class="form-group">
            <label for="solResponsavel">Responsável *</label>
            <input type="text" id="solResponsavel" class="form-control" placeholder="Nome do responsável" required>
          </div>
          <div class="form-group">
            <label for="solPrioridade">Prioridade *</label>
            <select id="solPrioridade" class="form-control" required>
              <option value="">Selecione...</option>
              <option value="baixa">Baixa</option>
              <option value="media">Média</option>
              <option value="alta">Alta</option>
              <option value="urgente">Urgente</option>
            </select>
          </div>
          <div class="form-group">
            <label for="solStatus">Status *</label>
            <select id="solStatus" class="form-control" required>
              <option value="aberta">Aberta</option>
              <option value="em_andamento">Em andamento</option>
              <option value="concluida">Concluída</option>
              <option value="cancelada">Cancelada</option>
            </select>
          </div>
          <div class="form-group">
            <label for="solPrazo">Prazo</label>
            <input type="date" id="solPrazo" class="form-control">
          </div>
          <div class="form-group full-width">
            <label for="solObservacoes">Observações</label>
            <textarea id="solObservacoes" class="form-control" placeholder="Observações adicionais..."></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="btnCancelSol">Cancelar</button>
        <button class="btn btn-primary" id="btnSaveSol">Salvar solicitação</button>
      </div>
    </div>
  </div>

  <!-- Modal Detalhes -->
  <div class="modal-overlay" id="modalSolDetalhe">
    <div class="modal modal-lg">
      <div class="modal-header">
        <h3 class="modal-title">Detalhes da solicitação</h3>
        <button class="modal-close" id="btnCloseSolDetalhe">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body" id="solDetalheContent"></div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="btnCloseSolDetalheFooter">Fechar</button>
        <button class="btn btn-primary" id="btnEditarSolDetalhe">Editar</button>
      </div>
    </div>
  </div>


  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/app.js"></script>
  <script>renderLayout('solicitacoes');</script>
  <script src="../js/solicitacoes.js"></script>
</body>
</html>
